<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🐱 喵喵防线 · 猫咖保卫战</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <style>
      :root {
        --bg: #1c1a17;
        --panel: #2a2622;
        --accent: #ffb64c;
        --text: #f4efe6;
        --muted: #b7ada0;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }
      #game-root {
        position: relative;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        border-radius: 14px;
        overflow: hidden;
      }
      #game-root canvas { display: block; }
      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--muted);
        z-index: 50;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-root">
        <div class="loading" id="loading">🐟 正在准备猫粮…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
